  .btn-primary{background:#b8860b;color:#fff}
  .btn-dark{background:#111827;color:#fff}
  .btn-green{background:#15803d;color:#fff}
  .btn-red{background:#dc2626;color:#fff}

  @media(min-width:700px){.sheet{max-width:650px;border-radius:25px;margin-bottom:30px}}

    <div class="text-right mt-6">
      <div class="flex justify-between items-center mb-1">
        <label class="label mb-0">اختر اسم السائق</label>

        <option value="">جاري تحميل السائقين...</option>

    <button data-view="shift">🚦<br>ورديتي</button>
    <button data-view="account">👤<br>حسابي</button>

</section>

<div id="modal" class="hiddenx modal"><div id="modalSheet" class="sheet"></div></div>
<div id="toast" class="fixed top-4 left-4 right-4 z-[100] hiddenx">

</div>

<script type="module">

const state = {
  driver: null,
  view: "available",
  data: {drivers:{}, cars:{}, availableTrips:{}, shifts:{}, trips:{}, expenses:{}, settings:{}},
  unsub: []
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num = id => Number($(id)?.value || 0);
const val = id => $(id)?.value?.trim() || "";
const money = n => new Intl.NumberFormat("ar-EG",{minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(n||0))+" ج";
const now = () => Date.now();
const dateTime = t => t ? new Intl.DateTimeFormat("ar-EG",{dateStyle:"medium",timeStyle:"short"}).format(new Date(t)) : "—";

function toast(msg, bad=false){
  $("toastText").textContent = msg;
  $("toastText").style.background = bad ? "#b91c1c" : "#111827";
  $("toast").classList.remove("hiddenx");
  setTimeout(() => $("toast").classList.add("hiddenx"), 2500);
}

function modal(x){
  $("modalSheet").innerHTML = x;
  $("modal").classList.remove("hiddenx");
}

let fuelCameraStream = null;
let fuelPhotoData = "";

function stopFuelCamera(){
  if(fuelCameraStream){
    fuelCameraStream.getTracks().forEach(t => t.stop());
    fuelCameraStream = null;
  }
}

function closeModal(){
  stopFuelCamera();
  $("modal").classList.add("hiddenx");
  $("modalSheet").innerHTML = "";
}
window.closeModal = closeModal;

async function sha256(text){
  const data = new TextEncoder().encode(text);
  return crypto.subtle.digest("SHA-256", data).then(buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,"0")).join(""));
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = 
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
    Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

async function loadDriversList(){
  const select = $("loginDriverSelect");
  if(!select) return;
  select.innerHTML = '<option value="">جاري تحميل السائقين...</option>';
  try{
    const snap = await get(ref(db, "drivers"));
    if(!snap.exists()){
      select.innerHTML = '<option value="">لا توجد بيانات سائقين في القاعدة</option>';
      return;
    }
    
    const rawData = snap.val();
    state.data.drivers = {};
    let html = '<option value="">اختر اسم السائق</option>';
    let count = 0;

    const processItem = (key, item) => {
      if(item && typeof item === "object"){
        const driverId = item.id || key;
        const driverName = item.name || item.fullName || item.driverName;
        if(driverName){
          state.data.drivers[driverId] = { ...item, id: driverId, name: driverName };
          html += `<option value="${esc(driverId)}">${esc(driverName)}</option>`;
          count++;
        } else {
          Object.keys(item).forEach(subKey => {
            const subItem = item[subKey];
            if(subItem && typeof subItem === "object"){
              const subId = subItem.id || subKey;
              const subName = subItem.name || subItem.fullName || subItem.driverName;
              if(subName){
                state.data.drivers[subId] = { ...subItem, id: subId, name: subName };
                html += `<option value="${esc(subId)}">${esc(subName)}</option>`;
                count++;
              }
            }
          });
        }
      }
    };

    if(Array.isArray(rawData)){
      rawData.forEach((item, index) => processItem(index, item));
    } else {
      Object.keys(rawData).forEach(key => processItem(key, rawData[key]));
    }

    if(count === 0){
      select.innerHTML = '<option value="">لا توجد أسماء سائقين مطابقة</option>';
    } else {
      select.innerHTML = html;
    }
  }catch(e){
    console.error(e);
    select.innerHTML = '<option value="">خطأ في الاتصال بقاعدة البيانات</option>';
    toast("تعذر تحميل السائقين", true);
  }
}

async function login(){
  const driverId = val("loginDriverSelect"), pass = val("loginPass");
  if(!driverId || !pass) return toast("اختر اسم السائق واكتب كلمة السر", true);
  const found = state.data.drivers[driverId];
  if(!found) return toast("السائق غير موجود، اختر من القائمة", true);
  const hash = await sha256(pass);
  if(found.passwordHash && found.passwordHash !== hash) return toast("كلمة السر غير صحيحة", true);
  if(!found.passwordHash && found.password && found.password !== pass) return toast("كلمة السر غير صحيحة", true);
  state.driver = {...found, id: driverId};
  localStorage.setItem("goldenFleetDriver", driverId);
  startListeners();
  showApp();
}

async function restoreLogin(){
  await loadDriversList();
  const id = localStorage.getItem("goldenFleetDriver");
  if(!id) return;
  const s = await get(ref(db, "drivers/" + id));
  if(s.exists()){
    const valData = s.val();
    state.driver = { ...(typeof valData === "object" ? valData : {}), id, name: valData.name || valData.fullName || id };
    startListeners();
    showApp();
  }
}

function startListeners(){
  state.unsub.forEach(u => u && u());
  state.unsub = [];
  const paths = ["cars", "availableTrips", "shifts", "trips", "expenses"];
  for(const p of paths){
    const u = onValue(ref(db, p), snap => {
      state.data[p] = snap.val() || {};
      render();
    });
    state.unsub.push(u);
  }
}

function showApp(){
  $("loginScreen").classList.add("hiddenx");
  $("appScreen").classList.remove("hiddenx");
  $("driverHeader").textContent = state.driver?.name || "السائق";
  render();
}

function activeShift(){
  return Object.values(state.data.shifts || {}).find(s =>
    s.driverId === state.driver?.id &&
    (s.status === "مفتوحة" || s.status === "مفتوحه" || s.status === "open") &&
    !s.endedAt
  );
}

function render(){
  if(!state.driver) return;
  $("driverHeader").textContent = state.driver.name || "السائق";
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
  if(state.view === "available") renderAvailable();
  if(state.view === "shift") renderShift();
  if(state.view === "account") renderAccount();
}

function renderAvailable(){
  const list = Object.values(state.data.availableTrips || {}).filter(t => t.status === "متاحة").sort((a,b) => (a.tripAt||0)-(b.tripAt||0));
  $("view").innerHTML = `
    <div class="mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-black">الرحلات المتاحة</h2>
        <p class="small mt-1">استلم الرحلة المناسبة لك. بعد الاستلام تصبح محجوزة لك فورًا.</p>
      </div>
      <button id="addNewTripBtn" class="btn btn-primary text-xs">+ رحلة جديدة</button>
    </div>
    ${!activeShift() ? `<div class="card p-4 mb-4 border border-amber-200 bg-amber-50">
      <b>⚠️ لا توجد وردية مفتوحة</b><p class="small mt-1">افتح ورديتك أولًا من تبويب «ورديتي» حتى تستطيع استلام رحلة.</p>
      <button class="btn btn-primary mt-3" data-go="shift">فتح وردية</button>
    </div>` : ""}
    <div class="grid gap-4">${list.map(t => tripCard(t)).join("") || `<div class="card p-6 text-center text-gray-500">لا توجد رحلات متاحة الآن.</div>`}</div>`;
  
  $("addNewTripBtn").onclick = addNewTripForm;
  $("view").querySelectorAll("[data-go]").forEach(b => b.onclick = () => { state.view = b.dataset.go; render(); });
  $("view").querySelectorAll("[data-trip]").forEach(b => b.onclick = () => tripDetails(b.dataset.trip));
  $("view").querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { const t = state.data.availableTrips[b.dataset.nav]; if(t) openNavigation(t); });
  $("view").querySelectorAll("[data-call]").forEach(b => b.onclick = () => { const phone = b.dataset.call; if(phone) location.href=`tel:${phone}`; else toast("رقم الهاتف غير متوفر", true); });
  $("view").querySelectorAll("[data-whatsapp]").forEach(b => b.onclick = () => { const phone = b.dataset.whatsapp; if(phone) window.open(`https://wa.me/${phone.replace(/[^0-9]/g,"")}`,"_blank"); else toast("رقم الواتساب غير متوفر", true); });
}

function addNewTripForm(){
  modal(`<h3 class="text-xl font-black">➕ إضافة رحلة جديدة</h3>
    <label class="label mt-4">اسم العميل</label><input id="newCustName" class="field" placeholder="اسم العميل">
    <label class="label mt-3">رقم الهاتف</label><input id="newCustPhone" class="field" placeholder="رقم الهاتف">
    <label class="label mt-3">مكان الإقلاع</label><input id="newPickup" class="field" placeholder="عنوان الإقلاع">
    <div class="grid grid-cols-2 gap-2 mt-2">
      <input id="newPickupLat" class="field text-xs" placeholder="خط العرض (Latitude) اختيار">
      <input id="newPickupLng" class="field text-xs" placeholder="خط الطول (Longitude) اختيار">
    </div>
    <label class="label mt-3">مكان النزول</label><input id="newDrop" class="field" placeholder="عنوان الوصول">
    <label class="label mt-3">قيمة الرحلة (ج)</label><input id="newAmount" class="field" type="number" step="0.01" placeholder="0">
    <button id="saveNewTrip" class="btn btn-primary w-full mt-5">حفظ وإضافة للرحلات المتاحة</button>
    <button class="btn btn-gray w-full mt-2" onclick="closeModal()">إلغاء</button>`);

  $("saveNewTrip").onclick = async () => {
    const customerName = val("newCustName"), customerPhone = val("newCustPhone"), pickupAddress = val("newPickup"), dropoffAddress = val("newDrop"), amount = num("newAmount");
    const pickupLat = num("newPickupLat") || null, pickupLng = num("newPickupLng") || null;
    if(!customerName || !pickupAddress || !dropoffAddress || amount <= 0) return toast("املأ الحانات الأساسية وقيمة الرحلة بشكل صحيح", true);
    
    const id = push(ref(db, "availableTrips")).key;
    const newTrip = {
      id, customerName, customerPhone, pickupAddress, dropoffAddress, amount,
      pickupLat, pickupLng,
      status: "متاحة", tripAt: now(), createdAt: now()
    };
    await set(ref(db, "availableTrips/" + id), newTrip);
    closeModal();
    toast("تم إضافة الرحلة بنجاح لقائمة الرحلات المتاحة");
  };
}

function tripCard(t){
  const phone = t.customerPhone || "";
  return `<div class="card p-4">
    <div class="flex items-start justify-between gap-3">
      <div><div class="font-black text-lg">${esc(t.customerName||"عميل")}</div><div class="small">${dateTime(t.tripAt)}</div></div>
      <div class="text-left"><div class="font-black text-lg">${money(t.amount)}</div><span class="badge available">متاحة</span></div>
    </div>
    <div class="mt-4 space-y-2 text-sm">
      <div>📍 <b>الإقلاع:</b> ${esc(t.pickupAddress||"")}</div>
      <div>🏁 <b>النزول:</b> ${esc(t.dropoffAddress||"")}</div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button class="btn btn-blue" data-trip="${esc(t.id)}">تفاصيل والموقع</button>
      <button class="btn btn-green" data-nav="${esc(t.id)}">📍 ملاحة</button>
    </div>
    ${phone ? `<div class="grid grid-cols-2 gap-2 mt-2">
      <button class="btn btn-dark text-xs" data-call="${esc(phone)}">📞 اتصال بالعميل</button>
      <button class="btn btn-whatsapp text-xs" data-whatsapp="${esc(phone)}">💬 واتساب</button>
    </div>`:""}
  </div>`;
}

function openNavigation(t){
  navigator.geolocation.getCurrentPosition(pos => {
    const origin = pos.coords.latitude + "," + pos.coords.longitude;
    const dest = (t.pickupLat != null && t.pickupLng != null) ? t.pickupLat + "," + t.pickupLng : encodeURIComponent(t.pickupAddress || "");
    location.href = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${dest}&travelmode=driving`;
  }, () => {
    location.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(t.pickupAddress||"")}&travelmode=driving`;
  }, {enableHighAccuracy: true, timeout: 10000});
}

function tripDetails(id){
  const t = state.data.availableTrips[id]; if(!t) return;
  const shift = activeShift();
  const phone = t.customerPhone || "";
  
  modal(`<h3 class="text-2xl font-black">تفاصيل الرحلة والمسافة</h3>
    <div class="mt-4 grid gap-3">
      <div class="card p-4 bg-amber-50 border border-amber-200">
        <span class="small font-bold text-amber-800">⏱️ المسافة والوقت الفعلي لموقع الإقلاع</span>
        <div id="distanceTimeBox" class="font-black text-lg mt-1 text-amber-950">جاري حساب موقعك الحالي...</div>
      </div>
      <div class="card p-4"><span class="small">التاريخ والوقت</span><div class="font-black mt-1">${dateTime(t.tripAt)}</div></div>
      <div class="card p-4"><span class="small">قيمة الرحلة</span><div class="font-black text-xl mt-1">${money(t.amount)}</div></div>
      <div class="card p-4"><span class="small">العميل</span><div class="font-black mt-1">${esc(t.customerName||"")}</div><div class="small mt-1">${esc(phone)}</div>
        ${phone ? `<div class="grid grid-cols-2 gap-2 mt-3">
          <button id="modalCall" class="btn btn-dark text-xs">📞 اتصال</button>
          <button id="modalWa" class="btn btn-whatsapp text-xs">💬 واتساب</button>
        </div>` : ""}
      </div>
      <div class="card p-4"><span class="small">موقع الإقلاع</span><div class="mt-1">${esc(t.pickupAddress||"")}</div>
        <button id="navPickup" class="btn btn-blue mt-3 w-full">📍 فتح الإقلاع في Google Maps</button></div>
      <div class="card p-4"><span class="small">موقع النزول</span><div class="mt-1">${esc(t.dropoffAddress||"")}</div>
        <button id="navDrop" class="btn btn-gray mt-3 w-full">🏁 فتح النزول في Google Maps</button></div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-5">
      <button id="claimBtn" class="btn btn-green" ${shift ? "" : "disabled"}>استلام الرحلة</button>
      <button id="closeBtn" class="btn btn-gray">إغلاق</button>
    </div>
    ${shift ? "" : "<p class='small text-red-600 mt-2'>يجب فتح وردية أولًا.</p>"}`);
  
  navigator.geolocation.getCurrentPosition(pos => {
    const driverLat = pos.coords.latitude;
    const driverLng = pos.coords.longitude;
    
    if(t.pickupLat != null && t.pickupLng != null) {
      const distKm = calculateDistance(driverLat, driverLng, t.pickupLat, t.pickupLng);
      const estMinutes = Math.round((distKm / 30) * 60);
      const roadDist = (distKm * 1.3).toFixed(1);
      const roadMinutes = Math.max(1, Math.round(estMinutes * 1.3));
      
      $("distanceTimeBox").innerHTML = `مسافة تقريبية: <b>${roadDist} كم</b> | وقت قيادة تقريبي: <b>حوالي ${roadMinutes} دقيقة</b>`;
    } else {
      $("distanceTimeBox").innerHTML = `تم تحديد موقعك. يفضل توفير إحداثيات الإقلاع لمتابعة المسافة الدقيقة بدقة.`;
    }
  }, () => {
    $("distanceTimeBox").innerHTML = `تعذر الحصول على موقع GPS الخاص بك حالياً. تأكد من إذن الموقع (Location Permission).`;
  }, {enableHighAccuracy: true, timeout: 8000});

  $("closeBtn").onclick = closeModal;
  if($("modalCall")) $("modalCall").onclick = () => location.href = `tel:${phone}`;
  if($("modalWa")) $("modalWa").onclick = () => window.open(`https://wa.me/${phone.replace(/[^0-9]/g,"")}`,"_blank");
  $("navPickup").onclick = () => openNavigation(t);
  $("navDrop").onclick = () => navigator.geolocation.getCurrentPosition(p => {
    location.href = `https://www.google.com/maps/dir/?api=1&origin=${p.coords.latitude},${p.coords.longitude}&destination=${encodeURIComponent(t.dropoffAddress||"")}&travelmode=driving`;
  }, () => location.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.dropoffAddress||"")}`);
  if(shift) $("claimBtn").onclick = () => claimTrip(t.id);
}

async function claimTrip(id){
  const shift = activeShift();
  if(!shift) return toast("افتح وردية أولًا", true);
  const tripRef = ref(db, "availableTrips/" + id);
  const result = await runTransaction(tripRef, current => {
    if(!current || current.status !== "متاحة") return;
    return {...current, status: "محجوزة", driverId: state.driver.id, driverName: state.driver.name, shiftId: shift.id, shiftNo: shift.shiftNo || shift.id, bookedAt: now(), updatedAt: now()};
  });
  if(!result.committed) return toast("الرحلة تم استلامها بواسطة سائق آخر", true);
  const trip = result.snapshot.val();
  const tripId = trip.id || id;
  await set(ref(db, "trips/" + tripId), {
    ...trip, id: tripId, status: "محجوزة", driverId: state.driver.id, driverName: state.driver.name,
    shiftId: shift.id, createdAt: trip.createdAt || now(), bookedAt: trip.bookedAt || now()
  });
  await update(ref(db, "shifts/" + shift.id + "/tripIds"), {[tripId]: true});
  closeModal(); toast("تم استلام الرحلة وربطها بالوردية"); state.view = "shift"; render();
}

async function cancelShiftCompletely(s, trips){
  if(!confirm("هل أنت متأكد من حذف ورديتك الحالية وإرجاع جميع رحلاتها إلى المتاحة؟")) return;
  for(const t of trips){

async function startFuelCamera(){
  const video = $("fuelVideo"), loading = $("cameraLoading"), err = $("cameraError");
  if(!video) return;
  try{
    fuelCameraStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}},
      audio: false
    });
    video.srcObject = fuelCameraStream;
    await video.play();
    loading?.classList.add("hiddenx");
    $("captureFuel").onclick = captureFuelPhoto;
    $("retakeFuel").onclick = async () => {
      fuelPhotoData = "";
      $("fuelPreview").classList.add("hiddenx");
      $("captureFuel").classList.remove("hiddenx");
      $("retakeFuel").classList.add("hiddenx");
      await startFuelCamera();
    };
  }catch(e){
    loading?.classList.add("hiddenx");
    if(err) err.textContent = "تعذر فتح الكاميرا: " + (e?.message || e);
    $("captureFuel").disabled = true;
  }
}

function captureFuelPhoto(){
  const video = $("fuelVideo"), canvas = $("fuelCanvas"), preview = $("fuelPreview");
  if(!video || !canvas || !video.videoWidth) return toast("الكاميرا لم تجهز بعد", true);
  const maxW = 900;
  const scale = Math.min(1, maxW / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  fuelPhotoData = canvas.toDataURL("image/jpeg", 0.72);
  preview.src = fuelPhotoData;
  preview.classList.remove("hiddenx");
  $("captureFuel").classList.add("hiddenx");
  $("retakeFuel").classList.add("hiddenx");
  stopFuelCamera();
  toast("تم التقاط صورة العداد بنجاح.");
}

function endShiftForm(s, revenue, exp, net, trips, expenses){
  const pctValue = Number(state.driver.percent ?? state.driver.nisba ?? state.driver.percentage ?? 0);
  const grossDriverPct = revenue * pctValue / 100;
  
  // حساب المصروف الشخصي للسائق المضاف في هذه الوردية
  const personalExp = expenses.filter(e => e.type === "مصروف شخصي للسائق" || e.personal).reduce((a,e) => a + Number(e.amount || 0), 0);
  
  // صافي نسبة السائق بعد خصم المصروف الشخصي
  const netDriverPct = Math.max(0, grossDriverPct - personalExp);
  const shiftNetAfterDriverPct = net - grossDriverPct;

  modal(`<h3 class="text-xl font-black">🔒 إنهاء الوردية</h3>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="card p-3"><span class="small">إجمالي الإيرادات</span><b class="block mt-1">${money(revenue)}</b></div>
      <div class="card p-3"><span class="small">إجمالي المصاريف العامة</span><b class="block mt-1">${money(exp)}</b></div>
      <div class="card p-3 col-span-2 bg-amber-50 border border-amber-200"><span class="small font-bold text-amber-900">نسبة السائق (كاملة بدون خصم)</span><b class="block mt-1 text-lg text-amber-950">${money(grossDriverPct)}</b></div>
      <div class="card p-3"><span class="small">المصروف الشخصي للسائق</span><b class="block mt-1 text-red-600">${money(personalExp)}</b></div>
      <div class="card p-3"><span class="small">صافي الوردية للشركة/المالك</span><b class="block mt-1">${money(shiftNetAfterDriverPct)}</b></div>
    </div>
    <label class="label mt-5">المبلغ المدفوع الآن للسائق نقداً</label>
    <input id="paidNow" class="field" type="number" step="0.01" value="0">
    <div class="card p-4 mt-3 bg-yellow-50"><span class="small">الباقي للسائق المرحل للتراكمي (بعد خصم المصروف الشخصي)</span><div id="carry" class="font-black text-xl mt-1">${money(netDriverPct)}</div></div>
    <button id="confirmEnd" class="btn btn-primary w-full mt-5">حفظ وإنهاء الوردية</button>`);

  const updateCarry = () => { 
    const paid = num("paidNow");
    $("carry").textContent = money(Math.max(0, netDriverPct - paid)); 
  };
  $("paidNow").oninput = updateCarry; 
  updateCarry();

  $("confirmEnd").onclick = async () => {
    const paid = Math.max(0, num("paidNow")), carry = Math.max(0, netDriverPct - paid);
    if(paid > netDriverPct) return toast("المبلغ المدفوع لا يمكن أن يتجاوز صافي نسبة السائق", true);
    
    await update(ref(db, "shifts/" + s.id), {
      status: "مغلقة", endedAt: now(), totalRevenue: revenue, totalExpenses: exp,
      driverPercentage: grossDriverPct, personalExpense: personalExp, netDriverPercentage: netDriverPct,
      net: shiftNetAfterDriverPct, paidToDriver: paid, driverCarry: carry
    });
    
    const aid = push(ref(db, "archives")).key;
    await set(ref(db, "archives/" + aid), {
      id: aid, month: new Date().toISOString().slice(0,7), type: "shift", shiftId: s.id, 
      driverId: state.driver.id, driverName: state.driver.name, totalRevenue: revenue, 
      totalExpenses: exp, driverPercentage: grossDriverPct, personalExpense: personalExp, 
      netDriverPercentage: netDriverPct, net: shiftNetAfterDriverPct, paidToDriver: paid, 
      driverCarry: carry, archivedAt: now()
    });

    closeModal(); toast("تم إنهاء الوردية وتحديث الحسابات بنجاح"); render();
  };
}

async function changePassword(){
  const old = val("oldPass"), nw = val("newPass"), nw2 = val("newPass2");
  if(!old || !nw || !nw2) return toast("املأ الخانات كلها", true);
  if(nw.length < 4) return toast("كلمة السر يجب أن تكون 4 أرقام/أحرف على الأقل", true);
  if(nw !== nw2) return toast("تأكيد كلمة السر غير مطابق", true);
  const d = state.driver;
  const oldHash = await sha256(old);
  if(d.passwordHash && d.passwordHash !== oldHash) return toast("كلمة السر الحالية غير صحيحة", true);
  if(!d.passwordHash && d.password && d.password !== old) return toast("كلمة السر الحالية غير صحيحة", true);
  
  const newHash = await sha256(nw);
  await update(ref(db, "drivers/" + d.id), {passwordHash: newHash, password: null, passwordChangedAt: now()});
  
  state.driver = {...d, passwordHash: newHash, password: null};
  if(state.data.drivers[d.id]){
    state.data.drivers[d.id].passwordHash = newHash;
    state.data.drivers[d.id].password = null;
  }
  
  toast("تم تغيير كلمة السر بنجاح");
  $("oldPass").value = ""; $("newPass").value = ""; $("newPass2").value = "";
}

$("loginBtn").onclick = login;
$("loginPass").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
$("reloadDriversBtn").onclick = loadDriversList;

$("logoutBtn").onclick = () => {
  localStorage.removeItem("goldenFleetDriver");
  state.driver = null;
  state.unsub.forEach(u => u && u());
  state.unsub = [];
  $("appScreen").classList.add("hiddenx");
  $("loginScreen").classList.remove("hiddenx");
  $("loginPass").value = "1234";
  loadDriversList();
};

document.querySelectorAll(".nav button").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });

signInAnonymously(auth).then(() => restoreLogin()).catch(e => {
  console.error(e);
  loadDriversList();
});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registered'))
      .catch(err => console.log('Service Worker failed', err));
  });
}
</script>
